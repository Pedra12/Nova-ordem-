name: Compilar Nova Ordem Android

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-android.yml"
      - "README.md"

permissions:
  contents: read

concurrency:
  group: nova-ordem-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar projeto 3D base e novo mapa
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y curl unzip
          curl -fL --retry 3 "https://codeload.github.com/Pedra12/Ruinas-Perdidas-Android/zip/refs/heads/main" -o /tmp/base.zip
          mkdir -p /tmp/base /tmp/mapa
          unzip -q /tmp/base.zip -d /tmp/base
          BASE="$(find /tmp/base -mindepth 1 -maxdepth 1 -type d | head -1)"
          mkdir -p RuinasPerdidas
          cp -a "$BASE/RuinasPerdidas/." RuinasPerdidas/
          curl -fL --retry 3 "https://github.com/Pedra12/Nova-ordem-/releases/download/V1.0.0/default.pending-1794873526-post-apocalyptic-city.zip" -o /tmp/mapa.zip
          unzip -q /tmp/mapa.zip -d /tmp/mapa
          test -s /tmp/mapa/source/Untitled.glb
          mkdir -p RuinasPerdidas/assets/maps
          cp /tmp/mapa/source/Untitled.glb RuinasPerdidas/assets/maps/Nova-Ordem.glb
          python3 - <<'PY'
          import json, struct, os, shutil, textwrap
          glb='RuinasPerdidas/assets/maps/Nova-Ordem.glb'
          with open(glb,'rb') as f:
              header=f.read(12)
              magic,version,total=struct.unpack('<4sII',header)
              if magic != b'glTF' or version != 2: raise SystemExit('GLB inválido ou versão incompatível')
              length,kind=struct.unpack('<I4s',f.read(8))
              if kind != b'JSON': raise SystemExit('Chunk JSON não encontrado')
              doc=json.loads(f.read(length).decode('utf-8').rstrip(' \\0'))
          uris=[]
          for image in doc.get('images',[]):
              uri=image.get('uri')
              if uri and not uri.startswith('data:'): uris.append(uri)
          for uri in uris:
              src=os.path.join('/tmp/mapa',uri)
              if not os.path.isfile(src):
                  raise SystemExit('Textura externa ausente no pacote: '+uri)
              dst=os.path.join('RuinasPerdidas/assets/maps',uri)
              os.makedirs(os.path.dirname(dst),exist_ok=True)
              shutil.copy2(src,dst)
          print('GLB válido. Texturas externas:', uris)
          print('Tamanho do GLB:', os.path.getsize(glb))
          PY
          python3 - <<'PY'
          import textwrap
          p='RuinasPerdidas/scripts/world/level.gd'
          s=open(p,encoding='utf-8').read()
          s=s.replace('const CITY_MAP_PATH := "res://assets/maps/Zombie-Pack.glb"','const CITY_MAP_PATH := "res://assets/maps/Nova-Ordem.glb"')
          s=s.replace('const START_POS := Vector3(0.0, 0.3, 0.0)','const START_POS := Vector3(0.0, 1.5, 0.0)')
          s=s.replace('var _rng := RandomNumberGenerator.new()','var _rng := RandomNumberGenerator.new()\nvar _map_bounds := AABB()')
          bounds_insert = '''    city.name = "NovoMapa_ZombiePack_Exploracao"
              add_child(city)
          '''
          bounds_code = '''    city.name = "NovoMapa_ZombiePack_Exploracao"
              city.scale = Vector3(3.0, 3.0, 3.0)
              add_child(city)
              _map_bounds = AABB()
              var has_map_bounds := false
              for bound_node in city.find_children("*", "MeshInstance3D", true, false):
                  var bound_mesh := bound_node as MeshInstance3D
                  if bound_mesh == null or bound_mesh.mesh == null:
                      continue
                  var world_bounds: AABB = bound_mesh.global_transform * bound_mesh.get_aabb()
                  if not has_map_bounds:
                      _map_bounds = world_bounds
                      has_map_bounds = true
                  else:
                      _map_bounds = _map_bounds.merge(world_bounds)
              print("NOVA ORDEM MAP BOUNDS: ", _map_bounds.position, " | ", _map_bounds.size)
          '''
          s=s.replace(bounds_insert,bounds_code)
          # Aplicar à colisão a mesma escala e transformação do mapa visual.
          s=s.replace('        add_child(map_body)', '        map_body.transform = city.transform\n        add_child(map_body)')
          # Escolher automaticamente um ponto com chão e espaço livre para o capsule do jogador.
          safe_spawn = textwrap.dedent('''
          func _find_safe_spawn_position() -> Vector3:
              var space := get_world_3d().direct_space_state
              var ray := PhysicsRayQueryParameters3D.new()
              ray.collision_mask = 1
              ray.collide_with_bodies = true
              if _map_bounds.size.length() < 1.0:
                  push_error("Limites do mapa não foram calculados; spawn cancelado.")
                  return Vector3(0.0, 1.5, 0.0)
              var candidates: Array[Vector3] = []
              var center := _map_bounds.get_center()
              candidates.append(Vector3(center.x, 0.0, center.z))
              var min_x := _map_bounds.position.x + 3.0
              var max_x := _map_bounds.end.x - 3.0
              var min_z := _map_bounds.position.z + 3.0
              var max_z := _map_bounds.end.z - 3.0
              for ix in 11:
                  for iz in 11:
                      candidates.append(Vector3(lerpf(min_x, max_x, float(ix) / 10.0), 0.0, lerpf(min_z, max_z, float(iz) / 10.0)))
              var rng := RandomNumberGenerator.new()
              rng.randomize()
              for i in 220:
                  candidates.append(Vector3(rng.randf_range(min_x, max_x), 0.0, rng.randf_range(min_z, max_z)))
              # Prioriza pontos próximos ao centro, nunca o limite externo do mapa.
              candidates.sort_custom(func(a: Vector3, b: Vector3) -> bool:
                  return Vector2(a.x - center.x, a.z - center.z).length_squared() < Vector2(b.x - center.x, b.z - center.z).length_squared()
              )
              for p in candidates:
                  if Vector2(p.x - center.x, p.z - center.z).length() > 30.0:
                      continue
                  var scan_y := _map_bounds.end.y + 3.0
                  for surface in 20:
                      ray.from = Vector3(p.x, scan_y, p.z)
                      ray.to = Vector3(p.x, _map_bounds.position.y - 3.0, p.z)
                      var hit := space.intersect_ray(ray)
                      if hit.is_empty():
                          break
                      var floor_point: Vector3 = hit.position
                      var collider := hit.get("collider") as Node
                      if collider == null or collider.name == "PisoInvisivel_Exploracao":
                          break
                      var normal: Vector3 = hit.normal
                      if normal.dot(Vector3.UP) >= 0.78 and floor_point.y <= _map_bounds.position.y + 8.0:
                          var clear := true
                          for ox in [-0.48, 0.48]:
                              for oz in [-0.48, 0.48]:
                                  var check := PhysicsRayQueryParameters3D.create(Vector3(p.x + ox, floor_point.y + 0.12, p.z + oz), Vector3(p.x + ox, floor_point.y + 1.95, p.z + oz), 1)
                                  if not space.intersect_ray(check).is_empty():
                                      clear = false
                          if clear:
                              print("PONTO DE NASCIMENTO LIVRE NO MAPA: ", floor_point)
                              return floor_point + Vector3(0.0, 0.10, 0.0)
                      scan_y = floor_point.y - 0.06
                      if scan_y <= _map_bounds.position.y - 2.9:
                          break
              push_error("Nenhum ponto livre foi encontrado na geometria real do mapa; não usar o piso invisível.")
              return Vector3(0.0, 1.5, 0.0)
          ''')
          s=s.replace('func _spawn_player() -> void:', safe_spawn + '\nfunc _spawn_player() -> void:')
          s=s.replace('    player.position = START_POS','    var spawn_pos := _find_safe_spawn_position()\n    player.position = spawn_pos')
          s=s.replace('    cam.global_position = START_POS + Vector3(0.0, 1.5, 0.0)','    cam.global_position = spawn_pos + Vector3(0.0, 1.5, 0.0)')
          s=s.replace('hud.show_message("Exploração livre • caminhe por todo o mapa")','hud.show_message("Nova Ordem • exploração livre")')
          # Esperar a física registrar o mapa e o piso antes de procurar o ponto de nascimento.
          s=s.replace('    _build_exploration_ground()\n    _spawn_player()', '    _build_exploration_ground()\n    await get_tree().physics_frame\n    _spawn_player()')
          open(p,'w',encoding='utf-8').write(s)
          p='RuinasPerdidas/project.godot'
          s=open(p,encoding='utf-8').read().replace('config/name="Ruínas Perdidas"','config/name="Nova Ordem"').replace('config/description="Jogo 3D de ação e exploração para Android"','config/description="Exploração 3D livre para Android"')
          open(p,'w',encoding='utf-8').write(s)
          PY
          test -s RuinasPerdidas/assets/maps/Nova-Ordem.glb

          # Remover mapas herdados do projeto-base. Manter somente o mapa Nova Ordem.
          find RuinasPerdidas/assets/maps -maxdepth 1 -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.dae' -o -iname '*.obj' -o -iname '*.fbx' \) ! -iname 'Nova-Ordem.glb' -delete
          find RuinasPerdidas/assets/maps -maxdepth 1 -type f -iname '*.import' ! -iname 'Nova-Ordem.glb.import' -delete
          # Descartar cache de importação antigo para impedir que mapas removidos reapareçam no APK.
          rm -rf RuinasPerdidas/.godot
          echo "Mapas 3D restantes:"
          find RuinasPerdidas/assets/maps -maxdepth 1 -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.dae' -o -iname '*.obj' -o -iname '*.fbx' \) -printf '%f\n'
          test "$(find RuinasPerdidas/assets/maps -maxdepth 1 -type f \( -iname '*.glb' -o -iname '*.gltf' -o -iname '*.dae' -o -iname '*.obj' -o -iname '*.fbx' \) | wc -l)" -eq 1
          du -h RuinasPerdidas/assets/maps/Nova-Ordem.glb

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Instalar componentes Android
        run: |
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          sdkmanager --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.1" "ndk;28.1.13356709" "cmake;3.10.2.4988404"

      - name: Baixar Godot 4.4.1 e templates
        run: |
          set -euo pipefail
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip" -o /tmp/godot.zip
          curl -fL --retry 3 "https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/godot /tmp/templates "$HOME/.local/share/godot/export_templates/4.4.1.stable" "$HOME/.config/godot"
          unzip -q /tmp/godot.zip -d /tmp/godot
          unzip -q /tmp/templates.tpz -d /tmp/templates
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.4.1.stable/"
          test -f "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt" || printf "4.4.1.stable" > "$HOME/.local/share/godot/export_templates/4.4.1.stable/version.txt"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --version

      - name: Importar projeto, validar scripts e compilar APK
        run: |
          set -euo pipefail
          GODOT=/tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          mkdir -p RuinasPerdidas/build "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --editor --import 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-import.log; then
            echo "ERRO: scripts GDScript inválidos durante a importação. APK não será gerado."
            exit 1
          fi
          # Teste real de inicialização da cena 3D, não apenas importação/exportação.
          cp RuinasPerdidas/project.godot /tmp/project.godot.original
          sed -i 's#run/main_scene="res://scenes/main_menu.tscn"#run/main_scene="res://scenes/main.tscn"#' RuinasPerdidas/project.godot
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --quit-after 180 2>&1 | tee /tmp/godot-runtime.log
          cp /tmp/project.godot.original RuinasPerdidas/project.godot
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script|O novo mapa 3D não foi encontrado|Não foi possível importar o novo mapa" /tmp/godot-runtime.log; then
            echo "ERRO: a cena de exploração não iniciou corretamente. APK não será publicado."
            exit 1
          fi
          if ! grep -q "NOVO MAPA | colisão unificada criada" /tmp/godot-runtime.log; then
            echo "ERRO: o mapa não confirmou a criação da colisão durante a execução. APK não será publicado."
            exit 1
          fi
          if ! grep -q "PONTO DE NASCIMENTO LIVRE NO MAPA" /tmp/godot-runtime.log; then
            echo "ERRO: nenhum ponto livre na geometria real do mapa foi encontrado. APK não será publicado."
            exit 1
          fi
          "$GODOT" --headless --path "$GITHUB_WORKSPACE/RuinasPerdidas" --export-debug "Android" "$GITHUB_WORKSPACE/RuinasPerdidas/build/NovaOrdem.apk" 2>&1 | tee /tmp/godot-export.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Failed to load script" /tmp/godot-export.log; then
            echo "ERRO: scripts GDScript inválidos durante a exportação. APK não será publicado."
            exit 1
          fi
          test -s RuinasPerdidas/build/NovaOrdem.apk
          "$ANDROID_HOME/build-tools/35.0.1/apksigner" verify --verbose RuinasPerdidas/build/NovaOrdem.apk
          unzip -t RuinasPerdidas/build/NovaOrdem.apk | tail -2
          if unzip -Z1 RuinasPerdidas/build/NovaOrdem.apk | grep -qi 'rua-bela-vista'; then
            echo "ERRO: mapa antigo Rua Bela Vista ainda está dentro do APK"
            exit 1
          fi
          if unzip -Z1 RuinasPerdidas/build/NovaOrdem.apk | grep -qi 'Zombie-Pack'; then
            echo "ERRO: mapa antigo Zombie-Pack ainda está dentro do APK"
            exit 1
          fi
          echo "Verificação concluída: mapas antigos ausentes do APK."
          ls -lh RuinasPerdidas/build/NovaOrdem.apk

      - name: Publicar APK e diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: Nova-Ordem-Android-APK
          path: |
            RuinasPerdidas/build/NovaOrdem.apk
            RuinasPerdidas/assets/maps/Nova-Ordem.glb
          if-no-files-found: error
          retention-days: 14
